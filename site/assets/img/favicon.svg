<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AMDA BTP">
  <!-- Reprise de la maison du logo, redessinée pour rester lisible à 16 px :
       un recadrage de l'original emporterait le lettrage avec le toit. -->
  <rect width="64" height="64" rx="12" fill="#033165"/>
  <!-- Cheminée, posée sur le rampant gauche. -->
  <path d="M17 19h6v13h-6z" fill="#fe6301"/>
  <!-- Toit en bandeau, avec les jambages qui descendent de part et d'autre. -->
  <path d="M32 11 59 38h-9L32 22 14 38H5z" fill="#fe6301"/>
  <path d="M6 36h8v18H6zM50 36h8v18h-8z" fill="#fe6301"/>
  <!-- Fenêtre à quatre carreaux, sous le faîtage. -->
  <path d="M27 31h4v4h-4zM33 31h4v4h-4zM27 37h4v4h-4zM33 37h4v4h-4z" fill="#fe6301"/>
</svg>
